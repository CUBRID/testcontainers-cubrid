plugins {
    id 'java-library'
    id 'com.vanniktech.maven.publish' version '0.36.0'
}

group = 'org.cubrid'
version = '0.1.0'
description = 'Testcontainers module for CUBRID'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release.set(8)
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

dependencies {
    api 'org.testcontainers:jdbc:1.21.4'

    testImplementation platform('org.junit:junit-bom:5.14.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly   'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testImplementation 'ch.qos.logback:logback-classic:1.5.32'
    testRuntimeOnly   'org.cubrid:cubrid-jdbc:11.3.2.0053'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
        showStandardStreams = false
    }
}

// Images the tests can run against, keyed by the value -Pcubrid.version accepts.
// Keep in sync with the matrix in .github/workflows/ci.yml.
def cubridImages = [
    '10.2'   : 'cubrid/cubrid:10.2',
    '11.0'   : 'cubrid/cubrid:11.0',
    '11.2'   : 'cubrid/cubrid:11.2',
    '11.3'   : 'cubrid/cubrid:11.3',
    '11.4'   : 'cubrid/cubrid:11.4',
    'nightly': 'ghcr.io/srltas/cubrid-nightly:nightly',
]

// CubridImageSubstitutor reads cubrid.image in the test JVM.
def useCubridVersion = { Test testTask, String cubridVersion ->
    def image = cubridImages[cubridVersion]
    if (image == null) {
        throw new GradleException(
            "Unknown cubrid.version '${cubridVersion}'. Supported: ${cubridImages.keySet().join(', ')}")
    }
    testTask.systemProperty 'cubrid.image', image
    testTask.doNotTrackState('CUBRID images are republished under the same tag')
}

def selectedCubridVersion = providers.gradleProperty('cubrid.version').orNull
if (selectedCubridVersion != null) {
    tasks.named('test', Test) { useCubridVersion(it, selectedCubridVersion) }
}

def versionTests = cubridImages.keySet().collect { cubridVersion ->
    def suffix = cubridVersion == 'nightly' ? 'Nightly' : cubridVersion.replace('.', '_')
    tasks.register("testCubrid${suffix}", Test) {
        description = "Runs the tests against ${cubridImages[cubridVersion]}."
        group = 'verification'
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        useCubridVersion(it, cubridVersion)
    }
}

tasks.register('testAllVersions') {
    description = 'Runs the tests against every CUBRID version in parallel.'
    group = 'verification'
    dependsOn versionTests
}

mavenPublishing {
    publishToMavenCentral()
    signAllPublications()

    coordinates(group.toString(), 'testcontainers-cubrid', version.toString())

    pom {
        name = 'testcontainers-cubrid'
        description = 'Testcontainers module for CUBRID'
        url = 'https://github.com/cubrid/testcontainers-cubrid'
        inceptionYear = '2026'

        licenses {
            license {
                name = 'MIT License'
                url = 'https://opensource.org/licenses/MIT'
                distribution = 'repo'
            }
        }
        developers {
            developer {
                id = 'cubrid'
                name = 'CUBRID'
                organization = 'CUBRID'
                organizationUrl = 'https://www.cubrid.org'
            }
        }
        scm {
            connection = 'scm:git:https://github.com/cubrid/testcontainers-cubrid.git'
            developerConnection = 'scm:git:ssh://git@github.com/cubrid/testcontainers-cubrid.git'
            url = 'https://github.com/cubrid/testcontainers-cubrid'
        }
    }
}
